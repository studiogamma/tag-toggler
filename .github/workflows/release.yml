name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate artifact attestation for main.js
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Generate artifact attestation for manifest.json
        uses: actions/attest@v4
        with:
          subject-path: manifest.json

      - name: Generate artifact attestation for styles.css
        uses: actions/attest@v4
        with:
          subject-path: styles.css

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
